{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}?v=3">
    {% block extra_head %}{% endblock %}

</head>
<body>
    {% block content %}

    {% endblock %}
    <footer class="taskbar" aria-label="Desktop taskbar">
        <details class="start-area">
            <summary class="start-button">
                <img class="start-logo" src="/media/logo.png" alt="" aria-hidden="true">
                Start
            </summary>
            <div class="start-menu">
                <div class="start-menu-heading">Windows XP Simulation</div>
                <a href="{% url 'restart' %}">Restart</a>
                <a href="{% url 'shutdown' %}">Shut Down</a>
            </div>
        </details>
        <div class="taskbar-window" aria-current="page">
            <span aria-hidden="true">Desktop</span>
            Windows XP Simulation
        </div>
        <a class="taskbar-app-button" href="{% url 'folder_root' %}" aria-label="Open desktop folder" title="Open desktop folder">
            <img src="/media/folder.png" alt="" aria-hidden="true">
        </a>
        <time class="tray" id="taskbar-clock" aria-label="Current local time"></time>
    </footer>
    <script src="{% static 'js/taskbar-clock.js' %}"></script>
</body>

</html>
